name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devsecops-app-repo
  ECS_SERVICE: devsecops-service
  ECS_CLUSTER: devsecops-cluster
  ECS_TASK_DEFINITION: devsecops-app-task

# Required permissions for GitHub OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Scan, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # 1. Run Code & Dependency Security Scan (Trivy SCA/SAST)
    - name: Run File-System Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

    # 2. Configure AWS Credentials using OIDC (No long-lived keys!)
    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::918111244640:role/devsecops-github-actions-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 3. Build Docker Image
    - name: Build and Tag Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

    # 4. Run Container Security Scan (Blocking on HIGH/CRITICAL)
    - name: Run Container Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
        format: 'table'
        exit-code: '1' 
        severity: 'CRITICAL,HIGH'

    # 5. Push Docker Image to ECR
    - name: Push Docker Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 6. Deploy Application to ECS/Fargate
    - name: Download current ECS task definition
      run: |
        aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

    - name: Render new task definition with new image ID
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: devsecops-container
        image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    # 7. Application Health Verification (Smoke Test)
    - name: Application Health Verification
      run: |
        echo "Retrieving ALB DNS Name..."
        ALB_DNS=$(aws elbv2 describe-load-balancers --names devsecops-alb --query 'LoadBalancers[0].DNSName' --output text)
        echo "Testing endpoint: http://$ALB_DNS"
        echo "Waiting 30 seconds for target group health checks to pass..."
        sleep 30
        CURL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS)
        if [ "$CURL_STATUS" -eq 200 ]; then
          echo "Health check passed! The application is responding with HTTP 200 OK."
        else
          echo "Health check failed with status $CURL_STATUS. The application might be unhealthy."
          exit 1
        fi